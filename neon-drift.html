<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
<title>Gamer Hub - Neon Drift</title>
<link rel="stylesheet" href="style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
* { box-sizing:border-box; }
body { display:flex; flex-direction:column; min-height:100vh; overflow:hidden; align-items:center; background:#000; }
.topbar h1 { font-family:'Press Start 2P',monospace; font-size:clamp(0.65rem,2.2vw,0.95rem); color:#00e5ff; text-shadow:0 0 12px #00e5ff; }
.topbar .back-link { font-family:'Press Start 2P',monospace; font-size:0.6rem; background:rgba(0,229,255,0.1); color:#00e5ff; border:1px solid #00e5ff; }
.topbar .back-link:hover { background:rgba(0,229,255,0.25); }
.credit { color:#00e5ff; font-family:'Press Start 2P',monospace; font-size:0.55rem; opacity:0.4; }
.game-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; padding:0.3em; }
#game { display:block; border-radius:4px; box-shadow:0 0 40px rgba(0,229,255,0.25),0 0 80px rgba(0,229,255,0.1),0 0 2px #00e5ff; touch-action:none; cursor:none; image-rendering:pixelated; }
.overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,8,0.94); color:#fff; text-align:center; padding:1em; z-index:10; font-family:'Press Start 2P',monospace; }
.overlay.hidden { display:none; }
.overlay h1 { font-size:clamp(1rem,4vw,1.8rem); margin:0 0 0.5em; color:#00e5ff; text-shadow:0 0 20px #00e5ff; }
.overlay .sub { font-size:0.55rem; color:#666; margin-bottom:1em; line-height:2.2; }
.overlay .btn { font-family:'Press Start 2P',monospace; font-size:0.65rem; background:#00e5ff; color:#000; border:none; border-radius:2px; padding:0.7em 1.5em; cursor:pointer; box-shadow:0 4px 0 #007a99,0 0 20px rgba(0,229,255,0.4); margin-top:0.8em; }
.overlay .btn:hover { background:#33eeff; }
.overlay .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #007a99; }
/* car select */
.car-select { display:flex; gap:0.8em; flex-wrap:wrap; justify-content:center; margin:0.6em 0; }
.car-opt { border:2px solid #333; border-radius:3px; padding:0.7em 0.6em; cursor:pointer; min-width:90px; font-size:0.45rem; text-align:center; transition:border-color 0.1s; }
.car-opt:hover:not(.locked) { border-color:#00e5ff; }
.car-opt.active { border-color:#ffea00; box-shadow:0 0 10px rgba(255,234,0,0.5); }
.car-opt.locked { opacity:0.35; cursor:not-allowed; }
.car-opt .car-icon { font-size:1.6rem; margin-bottom:0.4em; display:block; }
.car-opt .car-name { display:block; color:#aaa; margin-bottom:0.3em; }
.car-opt .car-lock { display:block; color:#555; font-size:0.38rem; line-height:1.8; }
/* results */
#res-rows { margin:0.5em 0 1em; font-size:0.5rem; line-height:2.8; }
#res-unlock { color:#ffea00; font-size:0.5rem; text-shadow:0 0 8px #ffea00; margin-bottom:0.5em; min-height:1.2em; }
#res-rows .p1 { color:#00e5ff; } #res-rows .p2 { color:#00ff41; } #res-rows .p3 { color:#ff6d00; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back-link" href="index.html">← HUB</a>
  <h1>NEON DRIFT</h1>
  <span class="spacer"></span>
</div>
<div class="game-wrap"><canvas id="game"></canvas></div>
<div class="credit">MADE BY ATHARV TRIPATHI</div>

<!-- Start / car select -->
<div class="overlay" id="start-screen">
  <h1>🏎 NEON DRIFT</h1>
  <p class="sub">UP/W — GAS &nbsp; DOWN/S — BRAKE<br/>LEFT/RIGHT — STEER &nbsp; SHIFT — DRIFT<br/>X — NITRO BOOST &nbsp; 3 LAPS TO WIN</p>
  <p style="font-size:0.5rem;color:#555;margin-bottom:0.6em">MOBILE: DRAG LEFT / RIGHT TO STEER · AUTO-GAS</p>
  <div class="car-select" id="car-select"></div>
  <button class="btn" id="start-btn">START RACE</button>
  <p id="best-display" style="margin-top:0.7em;font-size:0.48rem;color:#ffea00"></p>
</div>

<!-- Results -->
<div class="overlay hidden" id="results-screen">
  <h1>RACE OVER</h1>
  <div id="res-rows"></div>
  <p id="res-unlock"></p>
  <button class="btn" id="retry-btn">RACE AGAIN</button>
</div>

<script>
(() => {
  // ── Canvas ──
  const canvas = document.getElementById('game');
  const ctx    = canvas.getContext('2d');
  const LW = 600, LH = 600;
  canvas.width = LW; canvas.height = LH;
  ctx.imageSmoothingEnabled = false;

  const startScr   = document.getElementById('start-screen');
  const resultsSrc = document.getElementById('results-screen');
  const carSelect  = document.getElementById('car-select');
  const resRows    = document.getElementById('res-rows');
  const resUnlock  = document.getElementById('res-unlock');
  const bestDisp   = document.getElementById('best-display');
  const STORE_KEY  = 'gamerhub_neondrift';
  const isMobile   = ('ontouchstart' in window);

  // ── Storage ──
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); } catch { return {}; }
  }
  function saveStore(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch {} }

  // ── Car definitions ──
  const CAR_DEFS = [
    { id:0, name:'GHOST',   color:'#00e5ff', glow:'#00e5ff', bodyDark:'#007a99', maxSpd:240, accel:170, handling:2.4, drift:1.0, icon:'🏎', unlock:'DEFAULT' },
    { id:1, name:'INFERNO', color:'#ff6d00', glow:'#ff6d00', bodyDark:'#8b3a00', maxSpd:260, accel:190, handling:2.1, drift:1.2, icon:'🚗', unlock:'WIN A RACE' },
    { id:2, name:'PHANTOM', color:'#aa00ff', glow:'#aa00ff', bodyDark:'#550080', maxSpd:250, accel:180, handling:2.6, drift:1.3, icon:'🏎', unlock:'WIN 3 RACES' },
    { id:3, name:'GOLD',    color:'#ffea00', glow:'#ffea00', bodyDark:'#996000', maxSpd:275, accel:210, handling:2.0, drift:0.8, icon:'🚀', unlock:'LAP < 28s' },
  ];

  // ── Track control points (closed loop, visually clockwise) ──
  const RAW = [
    [300,555],[440,540],[525,475],[548,380],[525,275],
    [455,195],[365,145],[240,145],[148,193],[78,278],
    [62,385],[82,475],[160,545],[300,555]
  ];
  const TRACK_W = 58;

  // Catmull-Rom spline
  function catmullRom(pts, steps) {
    const result = [], n = pts.length;
    for (let i = 0; i < n - 1; i++) {
      const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(n-1,i+2)];
      for (let t = 0; t < steps; t++) {
        const tt=t/steps, tt2=tt*tt, tt3=tt2*tt;
        result.push([
          0.5*((2*p1[0])+(-p0[0]+p2[0])*tt+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*tt2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*tt3),
          0.5*((2*p1[1])+(-p0[1]+p2[1])*tt+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*tt2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*tt3)
        ]);
      }
    }
    return result;
  }
  const SPLINE = catmullRom(RAW, 14); // ~182 points

  // Finish line normal (perpendicular to track at start)
  const FL_PT  = SPLINE[0];
  const FL_DIR = [SPLINE[2][0]-SPLINE[0][0], SPLINE[2][1]-SPLINE[0][1]];
  const FL_LEN = Math.sqrt(FL_DIR[0]**2+FL_DIR[1]**2);
  const FL_NX  = FL_DIR[0]/FL_LEN, FL_NY = FL_DIR[1]/FL_LEN; // unit normal (track direction)

  // Nearest spline point (index + distance)
  function nearestSpline(x, y) {
    let mi = 0, md = Infinity;
    for (let i = 0; i < SPLINE.length; i++) {
      const d = (x-SPLINE[i][0])**2 + (y-SPLINE[i][1])**2;
      if (d < md) { md = d; mi = i; }
    }
    return { idx: mi, dist: Math.sqrt(md) };
  }

  // ── Pre-render track to offscreen canvas ──
  let trackCanvas;
  function buildTrack() {
    const oc = document.createElement('canvas');
    oc.width = LW; oc.height = LH;
    const c = oc.getContext('2d');

    // Background
    c.fillStyle = '#000010';
    c.fillRect(0, 0, LW, LH);

    // Subtle bg grid
    c.strokeStyle = 'rgba(0,229,255,0.04)';
    c.lineWidth = 1;
    for (let x = 0; x < LW; x += 24) { c.beginPath(); c.moveTo(x,0); c.lineTo(x,LH); c.stroke(); }
    for (let y = 0; y < LH; y += 24) { c.beginPath(); c.moveTo(0,y); c.lineTo(LW,y); c.stroke(); }

    // Draw spline as path
    function splinePath() {
      c.beginPath();
      c.moveTo(SPLINE[0][0], SPLINE[0][1]);
      for (let i = 1; i < SPLINE.length; i++) c.lineTo(SPLINE[i][0], SPLINE[i][1]);
      c.closePath();
    }

    // Road surface
    splinePath();
    c.strokeStyle = '#0d1128';
    c.lineWidth = TRACK_W;
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.stroke();

    // Road texture (slightly lighter lanes)
    splinePath();
    c.strokeStyle = '#111630';
    c.lineWidth = TRACK_W - 6;
    c.stroke();

    // Outer neon glow (cyan)
    c.shadowBlur = 12; c.shadowColor = '#00e5ff';
    splinePath();
    c.strokeStyle = '#00e5ff';
    c.lineWidth = TRACK_W + 4;
    c.stroke();

    // Erase center (restore road surface inside glow)
    splinePath();
    c.shadowBlur = 0;
    c.strokeStyle = '#0d1128';
    c.lineWidth = TRACK_W - 2;
    c.stroke();

    // Inner accent (purple)
    c.shadowBlur = 8; c.shadowColor = '#aa00ff';
    splinePath();
    c.strokeStyle = '#7700cc';
    c.lineWidth = 2;
    c.stroke();
    c.shadowBlur = 0;

    // Center dashed line (orange)
    c.setLineDash([14, 12]);
    c.strokeStyle = '#ff6d00';
    c.lineWidth = 2;
    splinePath();
    c.stroke();
    c.setLineDash([]);

    // Start/finish line (checkered)
    const sfAngle = Math.atan2(FL_NY, FL_NX) + Math.PI/2; // perpendicular to track
    c.save();
    c.translate(FL_PT[0], FL_PT[1]);
    c.rotate(sfAngle);
    const blockW = 8, blockH = 7, cols = Math.ceil(TRACK_W/blockW)+1, rows = 2;
    for (let bx = -cols/2; bx < cols/2; bx++) {
      for (let br = 0; br < rows; br++) {
        c.fillStyle = (bx+br)%2===0 ? '#fff' : '#000';
        c.fillRect(bx*blockW, -rows*blockH/2 + br*blockH, blockW, blockH);
      }
    }
    c.restore();

    trackCanvas = oc;
  }

  // ── Particles ──
  let parts = [];
  function burst(x,y,col,n,spd,life) {
    for (let i=0;i<n;i++) {
      const a=Math.random()*Math.PI*2, v=spd*(0.3+Math.random()*0.7);
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,maxLife:life,r:2+Math.random()*2,col});
    }
  }

  // Tire marks
  let tireMarks = [];

  // ── Car factory ──
  function mkCar(def, startOffset, startWpt, isPlayer) {
    // Starting position: offset along track from finish line
    const si = (startWpt) % SPLINE.length;
    const sp = SPLINE[si];
    // heading: angle from this point to next
    const sn = SPLINE[(si+1)%SPLINE.length];
    const heading = Math.atan2(sn[0]-sp[0], -(sn[1]-sp[1]));
    return {
      ...def, isPlayer,
      x: sp[0], y: sp[1],
      angle: heading,
      speed: 0, lateralVel: 0, driftAng: 0,
      gas:0, brake:0, steer:0, drifting:false, nitroActive:false,
      nitroFuel:3, nitroMax:3,   // charges
      lap:0, lapStart:0, bestLap:Infinity, totalTime:0,
      splineIdx: si, crossedHalf: false, prevLineSide: 0,
      finished: false, finishTime: Infinity,
      // AI
      aiWpt: si,
      aiError: (Math.random()-0.5)*0.3,
    };
  }

  // ── Game state ──
  let cars, player, countdown, countdownT, raceStarted, raceTime;
  let gameState = 'menu'; // menu | countdown | racing | finished
  let selectedCar = 0, loopStarted = false, lastT = 0;

  function initRace() {
    parts = []; tireMarks = [];
    const def = CAR_DEFS[selectedCar];
    player = mkCar(def, 0, 1, true);
    const ai1 = mkCar(CAR_DEFS[1], 1, 4, false);
    const ai2 = mkCar(CAR_DEFS[2], 2, 8, false);
    ai1.maxSpd = 200 + Math.random()*20; ai1.aiError = (Math.random()-0.5)*0.5;
    ai2.maxSpd = 195 + Math.random()*15; ai2.aiError = (Math.random()-0.5)*0.6;
    cars = [player, ai1, ai2];
    countdown = 3; countdownT = 0; raceStarted = false; raceTime = 0;
    gameState = 'countdown';
  }

  // ── Physics ──
  const TOTAL_LAPS = 3;

  function updateCar(car, dt) {
    if (car.finished) return;

    // Speed
    const boost = car.nitroActive ? 1.55 : 1;
    const maxSpd = car.maxSpd * boost;
    if (car.gas)   car.speed = Math.min(maxSpd, car.speed + car.accel * boost * dt);
    else if(car.brake) car.speed = Math.max(-40, car.speed - car.accel * 1.6 * dt);
    else { car.speed *= Math.pow(0.97, dt*60); if(Math.abs(car.speed)<1)car.speed=0; }

    // Off-track penalty
    const ns = nearestSpline(car.x, car.y);
    car.onTrack = ns.dist < TRACK_W/2 + 4;
    if (!car.onTrack) car.speed *= Math.pow(0.82, dt*60);

    // Steering
    const grip = car.drifting ? 0.42 : 1.0;
    const speedFactor = Math.min(1, Math.abs(car.speed)/90);
    const turnAmt = car.steer * car.handling * speedFactor * grip;
    car.angle += turnAmt * dt;

    // Drift angle buildup
    if (car.drifting && Math.abs(car.speed) > 55) {
      car.driftAng += car.steer * car.drift * 0.9 * dt;
      car.driftAng = Math.max(-0.55, Math.min(0.55, car.driftAng));
      // Sparks
      if (Math.random() < 0.5) {
        const rx=car.x-Math.sin(car.angle)*11, ry=car.y+Math.cos(car.angle)*11;
        burst(rx, ry, '#ff8800', 2, 130, 0.25);
        burst(rx, ry, '#ffff00', 1, 80,  0.18);
        tireMarks.push({x:rx, y:ry, col:'rgba(80,40,0,0.55)', age:0});
      }
    } else {
      car.driftAng *= Math.pow(0.75, dt*60);
    }

    // Nitro
    if (car.nitroActive) {
      car.nitroFuel -= 0.7 * dt;
      if (car.nitroFuel <= 0) { car.nitroFuel = 0; car.nitroActive = false; }
      const ex=car.x-Math.sin(car.angle)*13, ey=car.y+Math.cos(car.angle)*13;
      burst(ex, ey, car.color, 2, 150, 0.18);
      burst(ex, ey, '#ffffff', 1, 100, 0.12);
    } else {
      car.nitroFuel = Math.min(car.nitroMax, car.nitroFuel + 0.4*dt);
    }

    // Move
    const moveAng = car.angle + car.driftAng;
    car.x += Math.sin(moveAng) * car.speed * dt;
    car.y -= Math.cos(moveAng) * car.speed * dt;

    // Lap detection
    const dx=car.x-FL_PT[0], dy=car.y-FL_PT[1];
    const dot=dx*FL_NX+dy*FL_NY;
    const lateralDist=Math.abs(dx*(-FL_NY)+dy*FL_NX);
    const newSide=dot>0?1:-1;
    if (car.prevLineSide===-1&&newSide===1&&lateralDist<TRACK_W/2+10&&car.crossedHalf) {
      const now = raceTime;
      const lapTime = now - car.lapStart;
      if (car.lap > 0) car.bestLap = Math.min(car.bestLap, lapTime);
      car.lap++;
      car.lapStart = now;
      car.crossedHalf = false;
      if (car.lap > TOTAL_LAPS) {
        car.finished = true;
        car.finishTime = now;
        car.totalTime = now;
        if (car.isPlayer) finishRace();
      }
    }
    car.prevLineSide = newSide;
    // Crossed halfway
    const ni = nearestSpline(car.x, car.y).idx;
    if (ni > SPLINE.length * 0.45 && ni < SPLINE.length * 0.6) car.crossedHalf = true;

    if (car.isPlayer) raceTime += dt;
  }

  function updateAI(ai, dt) {
    if (!raceStarted || ai.finished) return;
    // Find target waypoint
    const tgt = SPLINE[ai.aiWpt];
    const dx=tgt[0]-ai.x, dy=tgt[1]-ai.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if (dist < 28) ai.aiWpt = (ai.aiWpt+1)%SPLINE.length;

    // Steer toward target
    const tgtAngle = Math.atan2(dx, -dy) + ai.aiError*0.3;
    let aDiff = tgtAngle - ai.angle;
    while (aDiff >  Math.PI) aDiff -= Math.PI*2;
    while (aDiff < -Math.PI) aDiff += Math.PI*2;

    ai.steer  = Math.max(-1, Math.min(1, aDiff * 3));
    ai.gas    = Math.abs(aDiff) < 0.5 ? 1 : 0;
    ai.brake  = Math.abs(aDiff) > 0.6 ? 1 : 0;
    ai.drifting = false;
    updateCar(ai, dt);
  }

  // ── Race end ──
  function finishRace() {
    gameState = 'finished';
    const st = loadStore();

    // Rank
    const ranked = [...cars].sort((a,b)=>
      (a.finished?a.finishTime:9999) - (b.finished?b.finishTime:9999));
    const pos = ranked.indexOf(player)+1;

    // Best lap global
    const bestLapMs = player.bestLap;
    const prev = st.bestLap || Infinity;
    if (bestLapMs < prev) st.bestLap = bestLapMs;

    // Wins
    if (pos===1) { st.wins = (st.wins||0)+1; }

    // Unlocks
    const unlocked = [];
    if ((st.wins||0) >= 1 && !(st.unlocked||[]).includes(1)) { (st.unlocked=st.unlocked||[]).push(1); unlocked.push('INFERNO'); }
    if ((st.wins||0) >= 3 && !(st.unlocked||[]).includes(2)) { (st.unlocked=st.unlocked||[]).push(2); unlocked.push('PHANTOM'); }
    if (bestLapMs < 28 && !(st.unlocked||[]).includes(3))    { (st.unlocked=st.unlocked||[]).push(3); unlocked.push('GOLD CAR'); }
    saveStore(st);

    // Render results
    const posLbl = ['🥇1ST','🥈2ND','🥉3RD'];
    resRows.innerHTML = `<div class="p${pos}">${posLbl[pos-1]||pos+'TH'} PLACE</div><div>TOTAL: ${fmtTime(player.totalTime)}</div><div>BEST LAP: ${player.bestLap<Infinity?fmtTime(player.bestLap):'--'}</div>`;
    resUnlock.textContent = unlocked.length ? '🔓 UNLOCKED: '+unlocked.join(', ')+'!' : '';
    resultsSrc.classList.remove('hidden');
    renderCarSelect();
    updateBestDisplay();
  }

  function fmtTime(s) {
    if (s >= 9999) return '--:--';
    const m=Math.floor(s/60), sec=(s%60).toFixed(2).padStart(5,'0');
    return m+':'+sec;
  }

  // ── Draw ──
  function draw() {
    ctx.clearRect(0, 0, LW, LH);

    // Track
    if (trackCanvas) ctx.drawImage(trackCanvas, 0, 0);

    // Tire marks
    tireMarks = tireMarks.filter(m => { m.age+=0.008; return m.age<1; });
    tireMarks.forEach(m => {
      ctx.globalAlpha = (1-m.age)*0.6;
      ctx.fillStyle = m.col;
      ctx.fillRect(Math.round(m.x)-2, Math.round(m.y)-2, 4, 4);
    });
    ctx.globalAlpha = 1;

    // Particles
    parts.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x)-p.r/2, Math.round(p.y)-p.r/2, p.r, p.r);
    });
    ctx.globalAlpha = 1;

    // Cars (draw AI first, then player on top)
    cars.forEach(c => { if (!c.isPlayer) drawCar(c); });
    drawCar(player);

    // HUD
    drawHUD();

    // Countdown overlay
    if (gameState === 'countdown') drawCountdown();

    // Scanlines
    for (let y = 0; y < LH; y += 2) {
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(0, y, LW, 1);
    }
  }

  function drawCar(car) {
    ctx.save();
    ctx.translate(Math.round(car.x), Math.round(car.y));
    ctx.rotate(car.angle);
    const CW=11, CL=20;
    // Shadow glow
    ctx.shadowBlur = 14; ctx.shadowColor = car.glow;
    // Body
    ctx.fillStyle = car.color;
    ctx.fillRect(-CW/2, -CL/2, CW, CL);
    // Dark hood/roof
    ctx.shadowBlur = 0;
    ctx.fillStyle = car.bodyDark;
    ctx.fillRect(-CW/2+2, -CL/2+2, CW-4, CL*0.45);
    ctx.fillRect(-CW/2+2, CL*0.05, CW-4, CL*0.4);
    // Headlights
    ctx.fillStyle = '#ffffff'; ctx.shadowBlur=8; ctx.shadowColor='#ffffff';
    ctx.fillRect(-CW/2, -CL/2, 3, 4);
    ctx.fillRect(CW/2-3, -CL/2, 3, 4);
    // Taillights
    ctx.fillStyle = '#ff1744'; ctx.shadowColor='#ff1744';
    ctx.fillRect(-CW/2, CL/2-4, 4, 4);
    ctx.fillRect(CW/2-4, CL/2-4, 4, 4);
    // Wheels
    ctx.shadowBlur=0; ctx.fillStyle='#111';
    ctx.fillRect(-CW/2-3, -CL/2+2, 3, 5);
    ctx.fillRect( CW/2,   -CL/2+2, 3, 5);
    ctx.fillRect(-CW/2-3,  CL/2-7, 3, 5);
    ctx.fillRect( CW/2,    CL/2-7, 3, 5);
    ctx.restore();
  }

  function drawHUD() {
    if (!raceStarted && gameState !== 'finished') return;
    const PX = 'Press Start 2P';
    ctx.save();

    // Lap counter (top center)
    ctx.textAlign='center'; ctx.font=`9px "${PX}"`;
    ctx.fillStyle='#00e5ff'; ctx.shadowBlur=8; ctx.shadowColor='#00e5ff';
    const lap = Math.min(player.lap+1, TOTAL_LAPS);
    ctx.fillText(`LAP ${lap} / ${TOTAL_LAPS}`, LW/2, 34);

    // Timer (top right)
    ctx.textAlign='right'; ctx.shadowColor='#00e5ff';
    ctx.fillText(fmtTime(raceTime), LW-18, 34);

    // Best lap (top left)
    ctx.textAlign='left'; ctx.fillStyle='#ffea00'; ctx.shadowColor='#ffea00';
    ctx.shadowBlur=6;
    ctx.fillText(player.bestLap<Infinity?'B:'+fmtTime(player.bestLap):'', 18, 34);

    // Nitro bar (bottom)
    ctx.shadowBlur=0;
    const bx=20, by=LH-26, bw=110, bh=10;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    const nitroPct = player.nitroFuel / player.nitroMax;
    ctx.fillStyle = player.nitroActive ? '#ffffff' : '#aa00ff';
    ctx.shadowBlur = player.nitroActive ? 12 : 4;
    ctx.shadowColor = player.nitroActive ? '#ffffff' : '#aa00ff';
    ctx.fillRect(bx, by, bw*nitroPct, bh);
    ctx.shadowBlur=0;
    ctx.fillStyle='#555'; ctx.font=`6px "${PX}"`; ctx.textAlign='left';
    ctx.fillText('NITRO ['+(player.nitroFuel>0.9?'X':'_')+']', bx, by-5);

    // Speed bar (bottom right)
    const sx=LW-130, sy=LH-26;
    const spdPct = Math.max(0, player.speed/player.maxSpd);
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(sx-1, sy-1, 112, 12);
    ctx.shadowBlur=6; ctx.shadowColor='#00e5ff';
    ctx.fillStyle=spdPct>0.85?'#ff6d00':'#00e5ff';
    ctx.fillRect(sx, sy, 110*spdPct, 10);
    ctx.shadowBlur=0;
    ctx.fillStyle='#555'; ctx.font=`6px "${PX}"`; ctx.textAlign='right';
    ctx.fillText('SPEED', LW-18, sy-5);

    // Position indicator
    const ranked=[...cars].sort((a,b)=>{
      if(a.lap!==b.lap)return b.lap-a.lap;
      const ai=nearestSpline(a.x,a.y).idx, bi=nearestSpline(b.x,b.y).idx;
      return bi-ai;
    });
    const pos=ranked.indexOf(player)+1;
    const posStr=pos===1?'1ST':pos===2?'2ND':'3RD';
    ctx.textAlign='right'; ctx.font=`11px "${PX}"`;
    ctx.fillStyle='#ffea00'; ctx.shadowBlur=8; ctx.shadowColor='#ffea00';
    ctx.fillText(posStr, LW-18, LH-36);

    ctx.restore();
  }

  function drawCountdown() {
    const lbl = countdown > 0 ? String(countdown) : 'GO!';
    const col  = countdown > 0 ? '#ff1744' : '#00e5ff';
    ctx.save();
    ctx.textAlign='center'; ctx.font=`60px "Press Start 2P"`;
    ctx.fillStyle=col; ctx.shadowBlur=30; ctx.shadowColor=col;
    ctx.fillText(lbl, LW/2, LH/2+22);
    ctx.restore();
  }

  // ── Game loop ──
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min((t-lastT)/1000, 0.05); lastT = t;
    parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});
    parts = parts.filter(p=>p.life>0);

    if (gameState === 'countdown') {
      countdownT += dt;
      if (countdownT >= 1) { countdownT=0; countdown--; if(countdown<0){raceStarted=true;gameState='racing';cars.forEach(c=>c.lapStart=0);} }
    }
    if (gameState === 'racing') {
      // Player input
      player.gas    = keys['w']||keys['arrowup']   || (isMobile && !mBrake) ? 1 : 0;
      player.brake  = keys['s']||keys['arrowdown']  || mBrake ? 1 : 0;
      player.steer  = (keys['d']||keys['arrowright']?1:0) - (keys['a']||keys['arrowleft']?1:0) + mSteer;
      player.steer  = Math.max(-1, Math.min(1, player.steer));
      player.drifting = !!(keys['shift'] || mDrift);
      if ((keys['x'] || mNitro) && player.nitroFuel >= 0.9 && !player.nitroActive) player.nitroActive = true;

      updateCar(player, dt);
      cars.forEach(c=>{ if(!c.isPlayer) updateAI(c, dt); });
    }
    draw();
  }

  // ── Input ──
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // Mobile
  let mSteer = 0, mBrake = false, mNitro = false, mDrift = false;
  let touchL = null, touchR = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const r=canvas.getBoundingClientRect();
      const lx=(t.clientX-r.left)*(LW/r.width);
      const ly=(t.clientY-r.top)*(LH/r.height);
      if (lx < LW/2) { touchL={id:t.identifier,sx:lx,sy:ly,cx:lx,cy:ly}; }
      else { touchR={id:t.identifier,sx:lx,sy:ly}; mBrake=ly>LH*0.6; mNitro=lx>LW*0.8; }
    }
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const r=canvas.getBoundingClientRect();
      const lx=(t.clientX-r.left)*(LW/r.width);
      const ly=(t.clientY-r.top)*(LH/r.height);
      if (touchL && t.identifier===touchL.id) {
        const dx=lx-touchL.sx;
        mSteer=Math.max(-1,Math.min(1,dx/40));
        mDrift=Math.abs(lx-touchL.sx)>30 && (ly-touchL.sy)>15;
      }
      if (touchR && t.identifier===touchR.id) { mBrake=ly>LH*0.6; }
    }
  }, {passive:false});
  canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (touchL && t.identifier===touchL.id) { touchL=null; mSteer=0; mDrift=false; }
      if (touchR && t.identifier===touchR.id) { touchR=null; mBrake=false; mNitro=false; }
    }
  });

  // ── Resize ──
  function resize() {
    const wrap=canvas.parentElement;
    const sz=Math.min(wrap.clientWidth,wrap.clientHeight,640)-8;
    canvas.style.width=sz+'px'; canvas.style.height=sz+'px';
  }
  window.addEventListener('resize', resize); resize();

  // ── Car select UI ──
  function renderCarSelect() {
    const st = loadStore();
    const unlocked = [0, ...(st.unlocked||[])];
    carSelect.innerHTML = '';
    CAR_DEFS.forEach(def => {
      const isUnlocked = unlocked.includes(def.id);
      const el = document.createElement('div');
      el.className = 'car-opt' + (isUnlocked?'':' locked') + (def.id===selectedCar?' active':'');
      el.innerHTML = `<span class="car-icon">${def.icon}</span><span class="car-name" style="color:${isUnlocked?def.color:'#444'}">${def.name}</span><span class="car-lock">${isUnlocked?'SPD:'+def.maxSpd:def.unlock}</span>`;
      if (isUnlocked) el.addEventListener('click', () => { selectedCar=def.id; renderCarSelect(); });
      carSelect.appendChild(el);
    });
  }

  function updateBestDisplay() {
    const st=loadStore();
    const parts=[];
    if (st.wins) parts.push('WINS: '+st.wins);
    if (st.bestLap) parts.push('BEST LAP: '+fmtTime(st.bestLap));
    bestDisp.textContent = parts.join(' · ');
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    startScr.classList.add('hidden');
    buildTrack();
    initRace();
    if (!loopStarted) { loopStarted=true; lastT=performance.now(); requestAnimationFrame(loop); }
  });
  document.getElementById('retry-btn').addEventListener('click', () => {
    resultsSrc.classList.add('hidden');
    startScr.classList.remove('hidden');
  });

  renderCarSelect();
  updateBestDisplay();

  // Idle draw
  ctx.fillStyle='#000010'; ctx.fillRect(0,0,LW,LH);
})();
</script>
</body>
</html>
