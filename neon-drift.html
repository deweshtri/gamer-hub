<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
<title>Gamer Hub - Neon Drift</title>
<link rel="stylesheet" href="style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
* { box-sizing:border-box; }
body { display:flex; flex-direction:column; min-height:100vh; overflow:hidden; align-items:center; background:#000; }
.topbar h1 { font-family:'Press Start 2P',monospace; font-size:clamp(0.65rem,2.2vw,0.95rem); color:#00e5ff; text-shadow:0 0 12px #00e5ff; }
.topbar .back-link { font-family:'Press Start 2P',monospace; font-size:0.6rem; background:rgba(0,229,255,0.1); color:#00e5ff; border:1px solid #00e5ff; }
.topbar .back-link:hover { background:rgba(0,229,255,0.25); }
.credit { color:#00e5ff; font-family:'Press Start 2P',monospace; font-size:0.55rem; opacity:0.4; }
.game-wrap { flex:1; display:flex; align-items:center; justify-content:center; width:100%; padding:0.3em; }
#game { display:block; border-radius:4px; box-shadow:0 0 40px rgba(0,229,255,0.25),0 0 80px rgba(0,229,255,0.1),0 0 2px #00e5ff; touch-action:none; cursor:none; image-rendering:pixelated; }
.overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,8,0.94); color:#fff; text-align:center; padding:1em; z-index:10; font-family:'Press Start 2P',monospace; }
.overlay.hidden { display:none; }
.overlay h1 { font-size:clamp(1rem,4vw,1.8rem); margin:0 0 0.5em; color:#00e5ff; text-shadow:0 0 20px #00e5ff; }
.overlay .sub { font-size:0.52rem; color:#666; margin-bottom:0.8em; line-height:2.4; }
.overlay .btn { font-family:'Press Start 2P',monospace; font-size:0.65rem; background:#00e5ff; color:#000; border:none; border-radius:2px; padding:0.7em 1.5em; cursor:pointer; box-shadow:0 4px 0 #007a99,0 0 20px rgba(0,229,255,0.4); margin-top:0.8em; margin-inline:0.3em; }
.overlay .btn:hover { background:#33eeff; }
.overlay .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #007a99; }
.car-select { display:flex; gap:0.7em; flex-wrap:wrap; justify-content:center; margin:0.5em 0; }
.car-opt { border:2px solid #333; border-radius:3px; padding:0.6em 0.55em; cursor:pointer; min-width:86px; font-size:0.42rem; text-align:center; }
.car-opt:hover:not(.locked) { border-color:#00e5ff; }
.car-opt.active { border-color:#ffea00; box-shadow:0 0 10px rgba(255,234,0,0.5); }
.car-opt.locked { opacity:0.3; cursor:not-allowed; }
.car-opt .car-icon { font-size:1.5rem; margin-bottom:0.35em; display:block; }
.car-opt .car-name { display:block; margin-bottom:0.25em; }
.car-opt .car-lock { display:block; color:#555; font-size:0.36rem; line-height:1.9; }
#go-unlock { color:#ffea00; font-size:0.5rem; text-shadow:0 0 8px #ffea00; margin:0.4em 0; min-height:1em; }
#go-score { font-size:1.2rem; color:#00e5ff; text-shadow:0 0 16px #00e5ff; }
#go-best { font-size:0.55rem; color:#ffea00; margin-top:0.3em; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back-link" href="index.html">← HUB</a>
  <h1>NEON DRIFT</h1>
  <span class="spacer"></span>
</div>
<div class="game-wrap"><canvas id="game"></canvas></div>
<div class="credit">MADE BY ATHARV TRIPATHI</div>

<!-- Start screen -->
<div class="overlay" id="start-screen">
  <h1>🏎 NEON DRIFT</h1>
  <p class="sub">↑ / W — LANE UP &nbsp; ↓ / S — LANE DOWN<br/>SHIFT — DRIFT LANE CHANGE &nbsp; X — NITRO<br/>DODGE TRAFFIC · OVERTAKE RIVALS</p>
  <p style="font-size:0.45rem;color:#444;margin-bottom:0.6em">MOBILE: SWIPE UP/DOWN · DOUBLE-TAP NITRO</p>
  <div class="car-select" id="car-select"></div>
  <button class="btn" id="start-btn">START RACE</button>
  <p id="best-display" style="margin-top:0.7em;font-size:0.48rem;color:#ffea00;min-height:1em"></p>
</div>

<!-- Game over screen -->
<div class="overlay hidden" id="gameover-screen">
  <h1 style="color:#ff1744;text-shadow:0 0 20px #ff1744">GAME OVER</h1>
  <p id="go-score">000000</p>
  <p id="go-best"></p>
  <p id="go-unlock"></p>
  <div>
    <button class="btn" id="retry-btn">RETRY</button>
    <button class="btn" id="menu-btn" style="background:#333;color:#00e5ff;box-shadow:0 4px 0 #111">MENU</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx    = canvas.getContext('2d');
  const LW = 600, LH = 600;
  canvas.width = LW; canvas.height = LH;
  ctx.imageSmoothingEnabled = false;

  // ── Road geometry ──
  const ROAD_TOP = 150, ROAD_BTM = 550;
  const N_LANES  = 4;
  const LANE_H   = (ROAD_BTM - ROAD_TOP) / N_LANES; // 100
  // Lane centers: 200, 300, 400, 500
  const LANE_Y   = Array.from({length: N_LANES}, (_, i) => ROAD_TOP + LANE_H * (i + 0.5));
  const PLAYER_X = 140;
  const CAR_L = 36, CAR_W = 19; // car length (along x), width (along y)

  // ── Car definitions ──
  const CAR_DEFS = [
    {id:0, name:'GHOST',   color:'#00e5ff', bodyDark:'#005e6e', glow:'#00e5ff', icon:'🏎', unlockPts:0},
    {id:1, name:'INFERNO', color:'#ff6d00', bodyDark:'#6a2c00', glow:'#ff6d00', icon:'🚗', unlockPts:5000},
    {id:2, name:'PHANTOM', color:'#bb00ff', bodyDark:'#4a0066', glow:'#bb00ff', icon:'🏎', unlockPts:15000},
    {id:3, name:'GOLD',    color:'#ffea00', bodyDark:'#7a5c00', glow:'#ffea00', icon:'🚀', unlockPts:30000},
  ];

  // ── Static background elements ──
  const STARS = Array.from({length:55}, (_, i) => ({
    x: (i * 137.5) % LW,
    y: ((i * 89.3) % (ROAD_TOP - 10)),
    size: i % 6 === 0 ? 2 : 1,
    twinkle: i * 0.7,
  }));
  const BUILDINGS = Array.from({length:18}, (_, i) => ({
    x: i * 36 - 14,
    h: 38 + ((i * 73 + 11) % 78),
    w: 28 + ((i * 31) % 12),
  }));

  // ── Storage ──
  const KEY = 'gamerhub_neondrift';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const save = d  => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };

  // ── State ──
  let gameState = 'menu';
  let scrollOff = 0, scrollSpd = 230;
  let score = 0, gameTime = 0, level = 1, levelT = 0;
  let shake = 0, flashAlpha = 0;
  let traffic = [], spawnT = 0, spawnInt = 1.5;
  let parts = [];
  let lastT = 0, loopGoing = false;
  let selectedCar = 0;

  const player = {
    lane: 1, targetLane: 1, displayY: 0,
    drifting: false, driftTilt: 0,
    nitroFuel: 3, nitroMax: 3, nitroOn: false,
    lives: 3, def: CAR_DEFS[0],
  };
  player.displayY = LANE_Y[player.lane];

  const rivals = [
    {name:'CPU-1', dist:0, spd:0.97, lane:0, color:'#00ff41', bodyDark:'#003314', glow:'#00ff41', screenX:-9999},
    {name:'CPU-2', dist:0, spd:0.93, lane:3, color:'#ff4499', bodyDark:'#550022', glow:'#ff4499', screenX:-9999},
  ];

  const TRAF_COLS = ['#44ccff','#ff4466','#44ff88','#ffcc44','#cc44ff','#ff8844','#44ffcc','#ff6633'];
  const DASH_W = 28, DASH_GAP = 22;

  // ── Particles ──
  function burst(x, y, col, n, spd, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.7);
      parts.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life, max: life, r: 1+Math.random()*2.5, col});
    }
  }

  // ── Draw background ──
  function drawBg() {
    // Sky
    ctx.fillStyle = '#000010';
    ctx.fillRect(0, 0, LW, LH);

    // Scrolling cyan grid (whole canvas, very subtle)
    const gp = scrollOff % 50;
    ctx.strokeStyle = 'rgba(0,229,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = -gp; x < LW; x += 50) {
      ctx.beginPath(); ctx.moveTo(Math.round(x), 0); ctx.lineTo(Math.round(x), LH); ctx.stroke();
    }
    for (let y = 0; y < LH; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LW, y); ctx.stroke();
    }

    // Stars (slow parallax)
    const sp = scrollOff * 0.08;
    const t = Date.now() * 0.001;
    STARS.forEach((s, i) => {
      const bright = 0.3 + 0.5 * Math.abs(Math.sin(s.twinkle + t * 0.9));
      ctx.fillStyle = `rgba(255,255,255,${bright.toFixed(2)})`;
      const sx = ((s.x - sp) % LW + LW) % LW;
      ctx.fillRect(Math.round(sx), Math.round(s.y), s.size, s.size);
    });

    // City silhouette
    ctx.fillStyle = '#0b0b1f';
    BUILDINGS.forEach(b => ctx.fillRect(b.x, ROAD_TOP - b.h, b.w, b.h));
    // Window lights (deterministic)
    ctx.fillStyle = 'rgba(255,234,0,0.35)';
    BUILDINGS.forEach((b, bi) => {
      for (let wi = 0; wi < 4; wi++) {
        const wx = b.x + 4 + ((bi * 7 + wi * 13) % (b.w - 8));
        const wy = ROAD_TOP - 6 - ((bi * 11 + wi * 17) % (b.h - 10));
        if (wy > ROAD_TOP - b.h + 4) ctx.fillRect(wx, wy, 3, 2);
      }
    });

    // Road surface
    ctx.fillStyle = '#07071a';
    ctx.fillRect(0, ROAD_TOP, LW, ROAD_BTM - ROAD_TOP);

    // Alternating lane tint
    for (let l = 0; l < N_LANES; l += 2) {
      ctx.fillStyle = 'rgba(0,229,255,0.012)';
      ctx.fillRect(0, ROAD_TOP + l * LANE_H, LW, LANE_H);
    }

    // Road edge glow
    ctx.shadowBlur = 16; ctx.shadowColor = '#00e5ff';
    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, ROAD_TOP); ctx.lineTo(LW, ROAD_TOP); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, ROAD_BTM); ctx.lineTo(LW, ROAD_BTM); ctx.stroke();
    ctx.shadowBlur = 0;

    // Inner edge fade
    const gt = ctx.createLinearGradient(0, ROAD_TOP, 0, ROAD_TOP + 22);
    gt.addColorStop(0, 'rgba(0,229,255,0.07)'); gt.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gt; ctx.fillRect(0, ROAD_TOP, LW, 22);
    const gb = ctx.createLinearGradient(0, ROAD_BTM - 22, 0, ROAD_BTM);
    gb.addColorStop(0, 'rgba(0,0,0,0)'); gb.addColorStop(1, 'rgba(0,229,255,0.07)');
    ctx.fillStyle = gb; ctx.fillRect(0, ROAD_BTM - 22, LW, 22);

    // Lane dividers (dashed orange, scrolling)
    const dp = scrollOff % (DASH_W + DASH_GAP);
    ctx.fillStyle = 'rgba(255,109,0,0.65)';
    for (let li = 1; li < N_LANES; li++) {
      const dy = ROAD_TOP + li * LANE_H;
      for (let x = -dp; x < LW; x += DASH_W + DASH_GAP) {
        ctx.fillRect(Math.round(x), dy - 1, DASH_W, 2);
      }
    }

    // Speed streaks in sky at high speed
    if (scrollSpd > 300 && Math.random() < 0.04) {
      ctx.fillStyle = `rgba(255,255,255,${(scrollSpd - 300) / 1500})`;
      ctx.fillRect(0, Math.round(Math.random() * ROAD_TOP), LW, 1);
    }
  }

  // ── Draw a car (facing right) ──
  function drawCar(x, y, def, tilt, flip) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flip) ctx.rotate(Math.PI);   // oncoming faces left
    if (tilt) ctx.rotate(tilt);
    ctx.shadowBlur = 10; ctx.shadowColor = def.glow || def.color;
    // Body
    ctx.fillStyle = def.color;
    ctx.fillRect(-CAR_L/2, -CAR_W/2, CAR_L, CAR_W);
    // Roof / cockpit
    ctx.fillStyle = def.bodyDark;
    ctx.fillRect(-CAR_L/2 + 6, -CAR_W/2 + 3, Math.round(CAR_L * 0.48), CAR_W - 6);
    // Windshield (front = right)
    ctx.fillStyle = 'rgba(180,220,255,0.45)';
    ctx.fillRect(CAR_L/2 - 11, -CAR_W/2 + 3, 9, CAR_W - 6);
    // Headlights (right)
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffffcc'; ctx.fillStyle = '#ffffcc';
    ctx.fillRect(CAR_L/2 - 2, -CAR_W/2, 2, 5);
    ctx.fillRect(CAR_L/2 - 2,  CAR_W/2 - 5, 2, 5);
    // Tail lights (left)
    ctx.shadowColor = '#ff1744'; ctx.fillStyle = '#ff1744';
    ctx.fillRect(-CAR_L/2, -CAR_W/2, 3, 5);
    ctx.fillRect(-CAR_L/2,  CAR_W/2 - 5, 3, 5);
    // Wheels
    ctx.shadowBlur = 0; ctx.fillStyle = '#111';
    ctx.fillRect(-CAR_L/2 + 4, -CAR_W/2 - 3, 7, 3);
    ctx.fillRect( CAR_L/2 - 11,-CAR_W/2 - 3, 7, 3);
    ctx.fillRect(-CAR_L/2 + 4,  CAR_W/2,     7, 3);
    ctx.fillRect( CAR_L/2 - 11, CAR_W/2,     7, 3);
    ctx.restore();
  }

  // ── HUD ──
  function drawHUD() {
    const PX = '"Press Start 2P"';
    ctx.save();
    ctx.font = `9px ${PX}`;

    // Score (top-left)
    ctx.textAlign = 'left'; ctx.fillStyle = '#00e5ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00e5ff';
    ctx.fillText('SCORE', 18, 28);
    ctx.font = `12px ${PX}`;
    ctx.fillText(Math.floor(score).toString().padStart(6, '0'), 18, 48);

    // Speed (top-center)
    ctx.font = `8px ${PX}`; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 4;
    ctx.fillText(Math.round(scrollSpd * 0.48) + ' km/h', LW / 2, 28);

    // Rank (top-right)
    const pd = scrollOff;
    const allD = [pd, ...rivals.map(r => r.dist)].sort((a, b) => b - a);
    const rank = allD.indexOf(pd) + 1;
    ctx.font = `10px ${PX}`; ctx.textAlign = 'right';
    ctx.fillStyle = '#ffea00'; ctx.shadowColor = '#ffea00'; ctx.shadowBlur = 8;
    ctx.fillText(rank === 1 ? '1ST' : rank === 2 ? '2ND' : '3RD', LW - 18, 48);
    ctx.font = `7px ${PX}`;
    ctx.fillText('PLACE', LW - 18, 28);

    // Lives (hearts) below score
    ctx.font = `9px ${PX}`; ctx.textAlign = 'left';
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < player.lives ? '#ff1744' : '#330011';
      ctx.shadowColor = i < player.lives ? '#ff1744' : 'transparent';
      ctx.shadowBlur = i < player.lives ? 6 : 0;
      ctx.fillText('♥', 18 + i * 20, 68);
    }

    // Level (top-right below rank)
    ctx.font = `7px ${PX}`; ctx.textAlign = 'right';
    ctx.fillStyle = '#555'; ctx.shadowBlur = 0;
    ctx.fillText('LV ' + level, LW - 18, 68);

    // Nitro bar (bottom-left)
    ctx.font = `6px ${PX}`; ctx.textAlign = 'left';
    ctx.fillStyle = '#666'; ctx.shadowBlur = 0;
    ctx.fillText('NITRO  [X]', 18, LH - 28);
    for (let i = 0; i < player.nitroMax; i++) {
      const full = i < player.nitroFuel;
      ctx.shadowBlur = full ? 8 : 0;
      ctx.shadowColor = full ? '#aa00ff' : 'transparent';
      ctx.fillStyle = full ? (player.nitroOn ? '#ffffff' : '#bb22ff') : '#1a1a2e';
      ctx.fillRect(18 + i * 20, LH - 22, 16, 10);
    }

    ctx.restore();
  }

  // ── Spawn traffic ──
  function spawnTraffic() {
    // Prefer lanes not crowded at the right edge
    const open = Array.from({length: N_LANES}, (_, i) => i)
      .filter(l => !traffic.some(t => t.lane === l && t.sx > LW - 140));
    const lane = open.length > 0 ? open[Math.floor(Math.random() * open.length)] : Math.floor(Math.random() * N_LANES);
    const col  = TRAF_COLS[Math.floor(Math.random() * TRAF_COLS.length)];
    const oncoming = level >= 5 && Math.random() < 0.12;
    traffic.push({
      sx: 650, lane, color: col, bodyDark: '#151530', glow: col,
      speedF: 0.22 + Math.random() * 0.45,
      oncoming, overtaken: false, dead: false,
    });
  }

  // ── Crash ──
  function doCrash() {
    player.lives--;
    shake = 0.55; flashAlpha = 0.5;
    scrollSpd = Math.max(230, scrollSpd * 0.72);
    burst(PLAYER_X, player.displayY, '#ff1744', 10, 170, 0.55);
    burst(PLAYER_X, player.displayY, '#ff8800',  5, 120, 0.4);
    if (player.lives <= 0) endGame();
  }

  // ── Update ──
  function update(dt) {
    if (gameState !== 'playing') return;

    const boost = player.nitroOn ? 1.55 : 1;
    scrollSpd  = Math.min(520, scrollSpd + 7 * dt);
    scrollOff += scrollSpd * boost * dt;
    gameTime  += dt;
    score     += scrollSpd * boost * dt / 8;

    // Level up
    levelT += dt;
    if (levelT > 28) { levelT = 0; level++; spawnInt = Math.max(0.5, spawnInt - 0.12); }

    // Nitro
    if (player.nitroOn) {
      player.nitroFuel = Math.max(0, player.nitroFuel - 0.85 * dt);
      if (player.nitroFuel < 0.01) player.nitroOn = false;
      burst(PLAYER_X - CAR_L / 2 + 3, player.displayY, player.def.color, 1, 110, 0.14);
    } else {
      player.nitroFuel = Math.min(player.nitroMax, player.nitroFuel + 0.38 * dt);
    }

    // Lane change smooth follow
    const tgtY = LANE_Y[player.targetLane];
    const spd  = player.drifting ? 12 : 8;
    player.displayY += (tgtY - player.displayY) * Math.min(1, spd * dt);
    player.driftTilt = (tgtY - player.displayY) * 0.004 * (player.drifting ? 2.2 : 0.6);

    // Drift sparks when lane-changing
    if (player.drifting && Math.abs(tgtY - player.displayY) > 10 && Math.random() < 0.35) {
      burst(PLAYER_X - CAR_L / 2 + 4, player.displayY, player.def.color, 2, 100, 0.22);
      burst(PLAYER_X - CAR_L / 2 + 4, player.displayY, '#ffffff', 1, 70, 0.14);
    }

    // Spawn traffic
    spawnT += dt;
    if (spawnT >= spawnInt) { spawnT = 0; spawnTraffic(); }

    // Move traffic
    traffic.forEach(t => {
      t.sx -= t.oncoming ? scrollSpd * 1.6 * dt : scrollSpd * (1 - t.speedF) * dt;
    });

    // Collisions & overtakes
    traffic.forEach(t => {
      if (t.dead || t.overtaken) return;
      const dx = Math.abs(PLAYER_X - t.sx);
      const dy = Math.abs(player.displayY - LANE_Y[t.lane]);
      if (dx < CAR_L * 0.68 && dy < CAR_W * 0.78) {
        t.dead = true; doCrash();
      } else if (!t.oncoming && t.sx < PLAYER_X - CAR_L && !t.overtaken) {
        t.overtaken = true;
        score += 60;
        burst(PLAYER_X, player.displayY, '#00e5ff', 3, 90, 0.26);
      }
    });
    traffic = traffic.filter(t => t.sx > -60 && !t.dead);

    // Rivals advance
    rivals.forEach(r => {
      r.dist += scrollSpd * r.spd * dt;
      r.screenX = PLAYER_X - (scrollOff - r.dist);
    });

    // Decay effects
    shake = Math.max(0, shake - dt * 2.2);
    flashAlpha = Math.max(0, flashAlpha - dt * 2);

    // Particles
    parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    parts = parts.filter(p => p.life > 0);
  }

  // ── Draw ──
  function draw() {
    ctx.save();
    if (shake > 0) {
      const s = shake * 7;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    drawBg();

    // Traffic
    traffic.forEach(t => {
      if (t.sx > -50 && t.sx < LW + 50)
        drawCar(t.sx, LANE_Y[t.lane], t, 0, t.oncoming);
    });

    // Rivals (only when on-screen)
    rivals.forEach(r => {
      if (r.screenX > 10 && r.screenX < LW - 10)
        drawCar(r.screenX, LANE_Y[r.lane], r, 0, false);
    });

    // Player
    drawCar(PLAYER_X, player.displayY, player.def, player.driftTilt, false);

    // Particles
    parts.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x) - p.r / 2, Math.round(p.y) - p.r / 2, p.r, p.r);
    });
    ctx.globalAlpha = 1;

    // Crash flash
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,0,0,${(flashAlpha * 0.3).toFixed(3)})`;
      ctx.fillRect(0, 0, LW, LH);
    }

    ctx.restore();
    drawHUD();

    // CRT scanlines
    for (let y = 0; y < LH; y += 2) {
      ctx.fillStyle = 'rgba(0,0,0,0.09)';
      ctx.fillRect(0, y, LW, 1);
    }
  }

  // ── End game ──
  function endGame() {
    gameState = 'gameover';
    const st = load();
    const prev = st.bestScore || 0;
    const newBest = Math.floor(score) > prev;
    if (newBest) st.bestScore = Math.floor(score);
    const unlocks = [];
    CAR_DEFS.forEach(d => {
      if (d.unlockPts > 0 && score >= d.unlockPts && !(st.unlocked || []).includes(d.id)) {
        (st.unlocked = st.unlocked || []).push(d.id);
        unlocks.push(d.name);
      }
    });
    save(st);
    document.getElementById('go-score').textContent = Math.floor(score).toString().padStart(6, '0');
    document.getElementById('go-best').textContent  = 'BEST: ' + (newBest ? '★ NEW! ' : '') + Math.max(Math.floor(score), prev).toString().padStart(6, '0');
    document.getElementById('go-unlock').textContent = unlocks.length ? '🔓 ' + unlocks.join(' + ') + ' UNLOCKED!' : '';
    document.getElementById('gameover-screen').classList.remove('hidden');
    renderCarSelect();
    updateBestDisplay();
  }

  // ── Game loop ──
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min((ts - lastT) / 1000, 0.05); lastT = ts;
    update(dt);
    draw();
  }

  // ── Input ──
  const keys = {};
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (keys[k]) return;
    keys[k] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
    if (gameState !== 'playing') return;
    const shifting = !!(keys['shift']);
    if ((k === 'arrowup' || k === 'w') && player.targetLane > 0) {
      player.targetLane--;
      if (shifting) { player.drifting = true; score += 35; }
    }
    if ((k === 'arrowdown' || k === 's') && player.targetLane < N_LANES - 1) {
      player.targetLane++;
      if (shifting) { player.drifting = true; score += 35; }
    }
    if (k === 'shift') player.drifting = true;
    if (k === 'x' && player.nitroFuel >= 0.9 && !player.nitroOn) player.nitroOn = true;
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    keys[k] = false;
    if (k === 'shift') player.drifting = false;
  });

  // Mobile touch
  let touchY0 = null, lastTap = 0;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    const r = canvas.getBoundingClientRect();
    touchY0 = (t.clientY - r.top) * (LH / r.height);
    const now = Date.now();
    if (now - lastTap < 300 && player.nitroFuel >= 0.9) player.nitroOn = true;
    lastTap = now;
  }, {passive: false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (touchY0 === null) return;
    const t = e.changedTouches[0];
    const r = canvas.getBoundingClientRect();
    const cy = (t.clientY - r.top) * (LH / r.height);
    const dy = cy - touchY0;
    if (Math.abs(dy) > 28) {
      const isDrift = Math.abs(dy) > 55;
      if (dy < 0 && player.targetLane > 0)           { player.targetLane--; if (isDrift) player.drifting = true; }
      else if (dy > 0 && player.targetLane < N_LANES - 1) { player.targetLane++; if (isDrift) player.drifting = true; }
      touchY0 = cy;
    }
  }, {passive: false});
  canvas.addEventListener('touchend', e => {
    e.preventDefault(); touchY0 = null; player.drifting = false;
  }, {passive: false});

  // ── Resize ──
  function resize() {
    const w = canvas.parentElement;
    const sz = Math.min(w.clientWidth, w.clientHeight, 640) - 8;
    canvas.style.width = sz + 'px'; canvas.style.height = sz + 'px';
  }
  window.addEventListener('resize', resize); resize();

  // ── UI helpers ──
  function renderCarSelect() {
    const st = load();
    const unlocked = [0, ...(st.unlocked || [])];
    const cs = document.getElementById('car-select');
    cs.innerHTML = '';
    CAR_DEFS.forEach(def => {
      const ok = unlocked.includes(def.id);
      const el = document.createElement('div');
      el.className = 'car-opt' + (ok ? '' : ' locked') + (def.id === selectedCar ? ' active' : '');
      el.innerHTML = `<span class="car-icon">${def.icon}</span>`
        + `<span class="car-name" style="color:${ok ? def.color : '#444'}">${def.name}</span>`
        + `<span class="car-lock">${ok ? (def.unlockPts > 0 ? def.unlockPts + ' PTS' : 'DEFAULT') : def.unlockPts + ' PTS'}</span>`;
      if (ok) el.addEventListener('click', () => { selectedCar = def.id; renderCarSelect(); });
      cs.appendChild(el);
    });
  }
  function updateBestDisplay() {
    const st = load();
    const el = document.getElementById('best-display');
    if (el && st.bestScore) el.textContent = 'BEST: ' + Math.floor(st.bestScore).toString().padStart(6, '0');
  }

  function startGame() {
    score = 0; gameTime = 0; level = 1; levelT = 0;
    scrollOff = 0; scrollSpd = 230;
    traffic = []; parts = []; spawnT = 0; spawnInt = 1.5;
    shake = 0; flashAlpha = 0;
    player.lane = 1; player.targetLane = 1; player.displayY = LANE_Y[1];
    player.nitroFuel = 3; player.nitroOn = false; player.drifting = false;
    player.lives = 3; player.def = CAR_DEFS[selectedCar];
    rivals[0].dist = -200; rivals[0].spd = 0.96 + Math.random() * 0.06;
    rivals[1].dist = -450; rivals[1].spd = 0.92 + Math.random() * 0.05;
    gameState = 'playing';
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    if (!loopGoing) { loopGoing = true; lastT = performance.now(); requestAnimationFrame(loop); }
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', () => {
    document.getElementById('gameover-screen').classList.add('hidden'); startGame();
  });
  document.getElementById('menu-btn').addEventListener('click', () => {
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  });

  renderCarSelect();
  updateBestDisplay();
  ctx.fillStyle = '#000010'; ctx.fillRect(0, 0, LW, LH);
})();
</script>
</body>
</html>
